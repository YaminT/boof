name: Release Desktop

# Build the Boof Runner desktop installers (macOS .dmg/.zip, Windows .exe, Linux
# AppImage) and attach them to the GitHub release for the tag. Runs automatically when a v* tag is
# pushed, or on demand for an existing tag via the Actions tab / `gh workflow run`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets to (e.g. v0.4.0-beta.1)"
        required: true
      ref:
        description: "Optional branch or commit to build instead of the tag (the tag still sets the version)"
        required: false
        type: string
      dry_run:
        description: "Build everything but create no release and upload nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout ${{ env.TAG }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || env.TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  build:
    name: ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            assets: packages/desktop/build/release/*.dmg packages/desktop/build/release/*.zip
          - os: windows-latest
            name: Windows
            assets: packages/desktop/build/release/*.exe
          # Six assets: macOS dmg+zip × arm64+x64 (4), Windows nsis x64 (1), Linux AppImage x64 (1).
          # No Linux arm64 leg (that needs a native arm runner). boof-sandbox is static x64 only.
          - os: ubuntu-latest
            name: Linux
            assets: packages/desktop/build/release/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout ${{ env.TAG }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || env.TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Version from the tag
        run: bash scripts/release-version.sh "$TAG" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install musl-gcc
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build static boof-sandbox
        if: matrix.name == 'Linux'
        run: |
          CC=musl-gcc BOOF_SANDBOX_STATIC=1 node packages/sandbox-linux/build.mjs
          test -x packages/sandbox-linux/dist/boof-sandbox
          file packages/sandbox-linux/dist/boof-sandbox | grep -q 'statically linked'

      - name: Build and stage desktop (${{ matrix.name }})
        run: npm run desktop:build && npm run stage -w @boof/desktop

      - name: Require clean staged desktop scan
        run: npm run check:staged-app -w @boof/desktop

      - name: Build installers (${{ matrix.name }})
        run: |
          if [[ "${{ matrix.name }}" == "macOS" ]]; then
            npm exec --workspace @boof/desktop -- electron-builder --mac --publish never
          elif [[ "${{ matrix.name }}" == "Linux" ]]; then
            # appimagetool is itself an AppImage. GitHub runners have no FUSE device.
            export APPIMAGE_EXTRACT_AND_RUN=1
            npm exec --workspace @boof/desktop -- electron-builder --linux --publish never
          else
            npm exec --workspace @boof/desktop -- electron-builder --win --publish never
          fi

      - name: Ensure release exists
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $RELEASE_PRERELEASE_FLAG \
              --title "$TAG" --notes "Boof Runner desktop $BOOF_RUNNER_APP_VERSION — automated build." || true

      - name: Upload ${{ matrix.name }} installers to $TAG
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" ${{ matrix.assets }} --repo "$GITHUB_REPOSITORY" --clobber
