name: Desktop start smoke

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to smoke (for example v0.4.0-beta.1)"
        required: true
        type: string
      ref:
        description: "Optional branch or commit to build instead of the tag (the tag still sets the version)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Start on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || env.TAG }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and stage desktop
        run: |
          bash scripts/release-version.sh "$TAG" >> "$GITHUB_ENV"
          npm run desktop:build
          npm run stage -w @boof/desktop

      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Start staged desktop and check health
        env:
          BOOF_SMOKE_EXPECTED_VERSION: ${{ github.event.inputs.tag && github.event.inputs.tag || github.ref_name }}
          BOOF_SMOKE_USER_DATA: ${{ runner.temp }}/boof-desktop-smoke
          BOOF_SMOKE_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
          HOME: ${{ runner.temp }}/boof-desktop-smoke-home
          USERPROFILE: ${{ runner.temp }}/boof-desktop-smoke-home
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node packages/desktop/scripts/desktop-smoke.mjs
          else
            node packages/desktop/scripts/desktop-smoke.mjs
          fi

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: .desktop-smoke/
          if-no-files-found: warn
