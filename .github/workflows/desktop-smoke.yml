name: Desktop start smoke

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to smoke (for example v0.4.0-beta.1)"
        required: true
        type: string
      ref:
        description: "Optional branch or commit to build instead of the tag (the tag still sets the version)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Start on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            launch: staged
          - os: windows-latest
            name: Windows
            launch: staged
          - os: ubuntu-latest
            name: Linux
            launch: appimage
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || env.TAG }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and stage desktop
        run: |
          bash scripts/release-version.sh "$TAG" >> "$GITHUB_ENV"
          npm run desktop:build

      - name: Build static Linux sandbox helper
        if: matrix.launch == 'appimage'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          CC=musl-gcc BOOF_SANDBOX_STATIC=1 node packages/sandbox-linux/build.mjs
          file packages/sandbox-linux/dist/boof-sandbox | grep -q 'statically linked'

      - name: Stage desktop
        run: npm run stage -w @boof/desktop

      - name: Build Linux AppImage
        if: matrix.launch == 'appimage'
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          npm exec --workspace @boof/desktop -- electron-builder --linux --publish never

      - name: Install virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          pick() {
            if apt-cache show "$1" >/dev/null 2>&1; then printf '%s\n' "$1"
            else printf '%s\n' "$2"; fi
          }
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libxss1 libxtst6 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libdrm2 libxkbcommon0 libpango-1.0-0 libcairo2 \
            "$(pick libgtk-3-0t64 libgtk-3-0)" \
            "$(pick libatk1.0-0t64 libatk1.0-0)" \
            "$(pick libatk-bridge2.0-0t64 libatk-bridge2.0-0)" \
            "$(pick libatspi2.0-0t64 libatspi2.0-0)" \
            "$(pick libasound2t64 libasound2)" \
            "$(pick libcups2t64 libcups2)"

      - name: Verify AppImage sandbox check
        if: matrix.launch == 'appimage'
        run: |
          images=(packages/desktop/build/release/*.AppImage)
          test "${#images[@]}" -eq 1
          xvfb-run -a "${images[0]}" --appimage-extract-and-run sandbox check

      - name: Start staged desktop and check health
        env:
          BOOF_SMOKE_LAUNCH: ${{ matrix.launch }}
          BOOF_SMOKE_EXPECTED_VERSION: ${{ github.event.inputs.tag && github.event.inputs.tag || github.ref_name }}
          BOOF_SMOKE_USER_DATA: ${{ runner.temp }}/boof-desktop-smoke
          BOOF_SMOKE_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
          HOME: ${{ runner.temp }}/boof-desktop-smoke-home
          USERPROFILE: ${{ runner.temp }}/boof-desktop-smoke-home
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # The smoke runs with a scratch HOME, which has no login keychain. Electron's
            # safeStorage then waits for a keychain prompt nobody can answer. Give it an
            # unlocked one, as a real user's login keychain would be.
            mkdir -p "$HOME/Library/Preferences" "$HOME/Library/Keychains"
            kc="$RUNNER_TEMP/smoke.keychain-db"
            security create-keychain -p smoke "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p smoke "$kc"
            security default-keychain -s "$kc"
            security list-keychains -s "$kc"
            security show-keychain-info "$kc"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            BOOF_SMOKE_EXPECT_KEYRING_FALLBACK=1 xvfb-run -a node packages/desktop/scripts/desktop-smoke.mjs
          else
            node packages/desktop/scripts/desktop-smoke.mjs
          fi

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.name }}
          path: .desktop-smoke/
          if-no-files-found: warn
