name: CI

# Offline checks only: the tests use the mock tool and never touch the network.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos-tests:
    name: macOS unit suite
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

  windows-tests:
    name: Windows unit suite
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Diagnose Windows temp ACL
        run: bun packages/heart/src/windows-acl-diag.ts

      - name: Test
        run: npx vitest run

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build and stage desktop for exclusion scan
        run: npm run stage -w @boof/desktop

      - name: Require clean staged desktop scan
        env:
          BOOF_REQUIRE_DESKTOP_BUILD: "1"
        run: npm run check:staged-app -w @boof/desktop && npx vitest run packages/desktop/scripts/stage-app.test.ts bin/src/manifests.test.ts

  npm-install:
    name: npm-only install
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Workspace packages are symlinks
        shell: bash
        run: |
          for d in node_modules/@boof/*; do
            test -L "$d" || { echo "$d is not a symlink: npm fetched it from the registry"; exit 1; }
          done

      - name: Build
        run: npm run build:server

      - name: Checkout is still git-clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "npm install or the build dirtied the checkout; the install script would refuse to update it"
            exit 1
          fi

      - name: Run the built CLI
        shell: bash
        run: |
          ls -la node_modules/@boof
          test "$(node bin/dist/boof-runner.js --version)" = "$(node -p "require('./package.json').version")"
          if node bin/dist/boof-runner.js status; then echo "an unknown command must exit 1"; exit 1; fi
          npm install -g --prefix "$RUNNER_TEMP/prefix" . --no-audit --no-fund
          "$RUNNER_TEMP/prefix/bin/boof-runner" --version
