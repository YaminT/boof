name: CI

# Offline checks only: the tests use the mock tool and never touch the network.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  npm-install:
    name: npm-only install
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build:server

      - name: Run the built CLI
        shell: bash
        run: |
          ls -la node_modules/@boof-runner
          test "$(node bin/dist/boof-runner.js --version)" = "$(node -p "require('./package.json').version")"
          if node bin/dist/boof-runner.js status; then echo "an unknown command must exit 1"; exit 1; fi
          npm install -g --prefix "$RUNNER_TEMP/prefix" . --no-audit --no-fund
          "$RUNNER_TEMP/prefix/bin/boof-runner" --version
