name: CI

# Offline checks only: the tests use the mock tool and never touch the network.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build the Linux sandbox helper
        run: node packages/sandbox-linux/build.mjs && test -x packages/sandbox-linux/dist/boof-sandbox

      - name: Test
        env:
          BOOF_REQUIRE_SANDBOX: "1"
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build and stage desktop for exclusion scan
        run: npm run stage -w @boof/desktop

      - name: Require clean staged desktop scan
        env:
          BOOF_REQUIRE_DESKTOP_BUILD: "1"
        run: npm run check:staged-app -w @boof/desktop && npx vitest run packages/desktop/scripts/stage-app.test.ts bin/src/manifests.test.ts

  npm-install:
    name: npm-only install
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Workspace packages are symlinks
        shell: bash
        run: |
          for d in node_modules/@boof/*; do
            test -L "$d" || { echo "$d is not a symlink: npm fetched it from the registry"; exit 1; }
          done

      - name: Build
        run: npm run build:server

      - name: Checkout is still git-clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "npm install or the build dirtied the checkout; the install script would refuse to update it"
            exit 1
          fi

      - name: Run the built CLI
        shell: bash
        run: |
          ls -la node_modules/@boof
          test "$(node bin/dist/boof-runner.js --version)" = "$(node -p "require('./package.json').version")"
          if node bin/dist/boof-runner.js status; then echo "an unknown command must exit 1"; exit 1; fi
          npm install -g --prefix "$RUNNER_TEMP/prefix" . --no-audit --no-fund
          "$RUNNER_TEMP/prefix/bin/boof-runner" --version

  sandbox-macos:
    name: sandbox acceptance on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Diagnose sandbox-exec baseline
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /bin/sh -c true
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/seatbelt-probe" packages/sandbox-linux/probe.c
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' "$RUNNER_TEMP/seatbelt-probe" read /etc/hostname
          /usr/bin/sandbox-exec -p '(version 1)(deny default)(allow process-exec*)(allow file-read*)' "$RUNNER_TEMP/seatbelt-probe" read /etc/hostname

      - name: Sandbox acceptance
        env:
          BOOF_REQUIRE_SANDBOX: "1"
          BOOF_DEBUG_SEATBELT_PROFILE: "1"
        run: npx vitest run packages/runner/src/sandbox/accept-files.test.ts packages/runner/src/sandbox/accept-net.test.ts packages/runner/src/sandbox/accept-proc.test.ts packages/runner/src/sandbox/accept.test.ts packages/runner/src/sandbox/accept-gate.test.ts packages/runner/src/sandbox/accept-task.test.ts

      - name: Diagnose Seatbelt denials
        if: always()
        run: log show --last 5m --style compact --predicate 'eventMessage CONTAINS[c] "deny"' 2>&1 | tail -300
